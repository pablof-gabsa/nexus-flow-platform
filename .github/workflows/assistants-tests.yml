name: Validate Nexus assistants
on:
  pull_request:
  push:
    branches: [main, 'codex/**']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci --prefix functions --no-fund
      - run: npm test --prefix functions
      - run: node --test tests/assistant-import.test.js
      - run: node tests/project-pdf-order.test.js
      - run: node tests/project-confidential.test.js
      - run: npm audit --prefix functions --omit=dev
